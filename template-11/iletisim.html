<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template 11 | İletişim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- SKYZON DEVELOPMENT: Defter temasi kapsayicisi -->
    <div class="journal">
      <header class="top">
        <a class="brand" href="index.html">Template 11</a>
        <nav class="nav">
          <a href="index.html">Anasayfa</a>
          <a href="hakkimda.html">Hakkımda</a>
          <a href="fotograflar.html">Fotoğraflar</a>
          <a href="hobilerim.html">Hobilerim</a>
          <a class="active" href="iletisim.html">İletişim</a>
        </nav>
      </header>
      <main class="stack">
        <!-- SKYZON DEVELOPMENT: Iletisim kagidi -->
        <section class="paper hero">
          <p class="tag">İletişim</p>
          <h1>Bir not bırak.</h1>
        </section>
        <section class="paper contact">
          <div class="card">
            <p>E-posta: merhaba@example.com</p>
            <p>Telefon: +90 555 555 55 55</p>
            <p>Konum: İstanbul</p>
          </div>
          <form class="form">
            <label for="isim">İsim</label>
            <input id="isim" type="text" placeholder="Adınızı yazın" />
            <label for="eposta">E-posta</label>
            <input id="eposta" type="email" placeholder="ornek@mail.com" />
            <label for="mesaj">Mesaj</label>
            <textarea id="mesaj" rows="5" placeholder="Mesajınızı yazın"></textarea>
            <button type="submit">Gönder</button>
          </form>
        </section>
      </main>
      <footer class="foot"><p>© 2026 Template 11 | SKYZON DEVELOPMENT</p></footer>
    </div>
  </body>
</html>
