<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template 10 | İletişim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- SKYZON DEVELOPMENT: Yumusak koyu kapsayici -->
    <div class="night-shell">
      <!-- SKYZON DEVELOPMENT: Ust gezinme -->
      <header class="night-bar">
        <a class="night-brand" href="index.html">Template X</a>
        <nav class="night-nav">
          <a href="index.html">Anasayfa</a>
          <a href="hakkimda.html">Hakkımda</a>
          <a href="fotograflar.html">Fotoğraflar</a>
          <a href="hobilerim.html">Hobilerim</a>
          <a class="active" href="iletisim.html">İletişim</a>
        </nav>
      </header>
      <main class="night-flow">
        <!-- SKYZON DEVELOPMENT: Iletisim hero alani -->
        <section class="glow-panel hero-panel compact-hero">
          <p class="eyebrow">Contact</p>
          <h1>Daha sakin bir koyu tema içinde iletişim alanı.</h1>
        </section>
        <!-- SKYZON DEVELOPMENT: Form ve bilgi alani -->
        <section class="glow-panel contact-panel">
          <div class="soft-card">
            <p>E-posta: merhaba@example.com</p>
            <p>Telefon: +90 555 555 55 55</p>
            <p>Konum: İstanbul</p>
            <p>Instagram: @ornekhesap</p>
          </div>
          <form class="night-form">
            <label for="isim">İsim</label>
            <input id="isim" type="text" placeholder="Adınızı yazın" />
            <label for="eposta">E-posta</label>
            <input id="eposta" type="email" placeholder="ornek@mail.com" />
            <label for="mesaj">Mesaj</label>
            <textarea id="mesaj" rows="5" placeholder="Mesajınızı yazın"></textarea>
            <button type="submit">Gönder</button>
          </form>
        </section>
      </main>
      <!-- SKYZON DEVELOPMENT: Alt bilgi -->
      <footer class="night-footer"><p>© 2026 Template 10 | SKYZON DEVELOPMENT</p></footer>
    </div>
  </body>
</html>
