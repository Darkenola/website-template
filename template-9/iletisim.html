<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template 9 | İletişim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- SKYZON DEVELOPMENT: Poster kapsayicisi -->
    <div class="poster-shell">
      <!-- SKYZON DEVELOPMENT: Ust rota alani -->
      <header class="poster-bar">
        <a class="poster-brand" href="index.html">TEMPLATE 09</a>
        <nav class="poster-nav">
          <a href="index.html">Anasayfa</a>
          <a href="hakkimda.html">Hakkımda</a>
          <a href="fotograflar.html">Fotoğraflar</a>
          <a href="hobilerim.html">Hobilerim</a>
          <a class="active" href="iletisim.html">İletişim</a>
        </nav>
      </header>
      <main class="poster-grid">
        <!-- SKYZON DEVELOPMENT: Iletisim poster alani -->
        <section class="slab hero-slab orange">
          <p class="slug">CONTACT</p>
          <h1>Mesaj alanı da aynı festival afişi ritmiyle çalışır.</h1>
        </section>
        <!-- SKYZON DEVELOPMENT: Form ve bilgi alani -->
        <section class="slab wide-slab white contact-wrap">
          <div class="poster-card">
            <p>E-posta: merhaba@example.com</p>
            <p>Telefon: +90 555 555 55 55</p>
            <p>Konum: İstanbul</p>
            <p>Instagram: @ornekhesap</p>
          </div>
          <form class="poster-form">
            <label for="isim">İsim</label>
            <input id="isim" type="text" placeholder="Adınızı yazın" />
            <label for="eposta">E-posta</label>
            <input id="eposta" type="email" placeholder="ornek@mail.com" />
            <label for="mesaj">Mesaj</label>
            <textarea id="mesaj" rows="5" placeholder="Mesajınızı yazın"></textarea>
            <button type="submit">Gönder</button>
          </form>
        </section>
      </main>
      <!-- SKYZON DEVELOPMENT: Alt bilgi -->
      <footer class="poster-footer"><p>© 2026 Template 9 | SKYZON DEVELOPMENT</p></footer>
    </div>
  </body>
</html>
