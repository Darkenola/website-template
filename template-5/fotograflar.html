    <!-- SKYZON DEVELOPMENT: Organik jurnal kapsayicisi -->

      <!-- SKYZON DEVELOPMENT: Ust alan -->
      <header class="masthead">
        <div>
          <p class="stamp">TEMPLATE 05</p>
          <a class="logo" href="index.html">Field Notes</a>

      <main class="flow">
        <!-- SKYZON DEVELOPMENT: Baslik paneli -->
        <section class="hero-panel compact">
          <div class="hero-copy">
            <p class="eyebrow">Fotoğraflar</p>
            <h1>Manzara kartları ve doğal tonlardan oluşan galeri.</h1>
          </div>
          <aside class="postcard">
            <p>Galeri burada bir albüm sayfası gibi hissettirilir; tonlar daha sakin seçilir.</p>
          </aside>
        </section>

        <!-- SKYZON DEVELOPMENT: Galeri alanlari -->
        <section class="paper">
          <div class="album-grid">
            <figure class="scene dawn"><figcaption>Sabah serinliği</figcaption></figure>
            <figure class="scene grove"><figcaption>Yeşil doku</figcaption></figure>
            <figure class="scene dune"><figcaption>Toprak tonları</figcaption></figure>
            <figure class="scene water"><figcaption>Sakin su yüzeyi</figcaption></figure>
            <figure class="scene cloud"><figcaption>Hafif bulut örtüsü</figcaption></figure>
            <figure class="scene pine"><figcaption>Orman hissi</figcaption></figure>
          </div>
        </section>
      </main>

      <!-- SKYZON DEVELOPMENT: Alt bilgi -->
