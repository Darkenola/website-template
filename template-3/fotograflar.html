<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template 3 | Fotoğraflar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- SKYZON DEVELOPMENT: Renkli kolaj site kapsayicisi -->
    <div class="poster">
      <!-- SKYZON DEVELOPMENT: Ust serit -->
      <header class="ribbon">
        <a class="mark" href="index.html">TEMPLATE 03</a>
        <nav class="menu">
          <a href="index.html">Anasayfa</a>
          <a href="hakkimda.html">Hakkımda</a>
          <a class="active" href="fotograflar.html">Fotoğraflar</a>
          <a href="hobilerim.html">Hobilerim</a>
          <a href="iletisim.html">İletişim</a>
        </nav>
      </header>

      <main class="stack">
        <!-- SKYZON DEVELOPMENT: Sayfa baslik alani -->
        <section class="hero-board compact-board">
          <div class="hero-note orange">
            <p class="micro">Fotoğraflar</p>
            <h1>Polaroid ve çıkartma havasında bir galeri.</h1>
          </div>
          <div class="hero-note blue">
            <p>Renk blokları gerçek görsellerin yerini tutuyor ve daha oyuncu bir atmosfer kuruyor.</p>
          </div>
        </section>

        <!-- SKYZON DEVELOPMENT: Fotograf kutulari -->
        <section class="sheet">
          <div class="photo-wall">
            <figure class="snap sky">
              <figcaption>Yumuşak gökyüzü tonları</figcaption>
            </figure>
            <figure class="snap sun">
              <figcaption>Sıcak ve enerjik bir kare</figcaption>
            </figure>
            <figure class="snap grass">
              <figcaption>Yeşil dokularla canlı bir alan</figcaption>
            </figure>
            <figure class="snap berry">
              <figcaption>Yoğun renklerle dikkat çeken bir yüzey</figcaption>
            </figure>
            <figure class="snap peach">
              <figcaption>Pastel geçişli yumuşak bir görünüm</figcaption>
            </figure>
            <figure class="snap ink">
              <figcaption>Daha koyu kontrastlı bir kart</figcaption>
            </figure>
          </div>
        </section>
      </main>

      <!-- SKYZON DEVELOPMENT: Alt bilgi -->
      <footer class="footer">
        <p>© 2026 Template 3 | SKYZON DEVELOPMENT</p>
      </footer>
    </div>
  </body>
</html>
