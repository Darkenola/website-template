<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template 6 | Fotoğraflar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- SKYZON DEVELOPMENT: Retro terminal kapsayicisi -->
    <div class="terminal-shell">
      <!-- SKYZON DEVELOPMENT: Ust terminal seridi -->
      <header class="terminal-bar">
        <a class="terminal-brand" href="index.html">template-06://retro</a>
        <nav class="terminal-nav">
          <a href="index.html">Anasayfa</a>
          <a href="hakkimda.html">Hakkımda</a>
          <a class="active" href="fotograflar.html">Fotoğraflar</a>
          <a href="hobilerim.html">Hobilerim</a>
          <a href="iletisim.html">İletişim</a>
        </nav>
      </header>
      <main class="terminal-layout">
        <!-- SKYZON DEVELOPMENT: Galeri acilis alani -->
        <section class="screen hero-screen compact-screen">
          <p class="prompt">gallery.render</p>
          <h1>CRT filtreli görsel blok galerisi.</h1>
          <p class="lead">Gerçek görsel olmadan terminal tonlarında yüzeyler kullanılır.</p>
        </section>
        <!-- SKYZON DEVELOPMENT: Galeri kareleri -->
        <section class="screen wide-screen">
          <p class="prompt">gallery.frames</p>
          <div class="gallery-grid">
            <figure class="frame frame-a"><figcaption>yeşil sinyal</figcaption></figure>
            <figure class="frame frame-b"><figcaption>eski ekran izi</figcaption></figure>
            <figure class="frame frame-c"><figcaption>tarama çizgileri</figcaption></figure>
            <figure class="frame frame-d"><figcaption>veri parlama efekti</figcaption></figure>
            <figure class="frame frame-e"><figcaption>koyu frekans alanı</figcaption></figure>
            <figure class="frame frame-f"><figcaption>sabit ve sinyal dengesi</figcaption></figure>
          </div>
        </section>
      </main>
      <!-- SKYZON DEVELOPMENT: Alt terminal metni -->
      <footer class="terminal-footer"><p>© 2026 Template 6 | SKYZON DEVELOPMENT</p></footer>
    </div>
  </body>
