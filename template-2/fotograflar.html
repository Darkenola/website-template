    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- SKYZON DEVELOPMENT: Koyu temali ana kapsayici -->
    <div class="shell">
      <!-- SKYZON DEVELOPMENT: Ust gezinme -->
      <header class="topbar">
        <a class="logo" href="index.html">T2/CORE</a>
        <nav class="nav">
          <a href="index.html">Anasayfa</a>
          <a href="hakkimda.html">Hakkımda</a>
          <a class="active" href="fotograflar.html">Fotoğraflar</a>
          <a href="hobilerim.html">Hobilerim</a>
          <a href="iletisim.html">İletişim</a>
        </nav>
      </header>

      <main class="layout">
        <!-- SKYZON DEVELOPMENT: Sayfa basligi -->
        <section class="hero compact">
          <div class="hero-copy">
            <p class="label">VISUAL BANK</p>
            <h1>Sinematik bloklardan oluşan bir galeri yapısı.</h1>
          </div>
          <p class="lead">
            Gerçek görseller eklenmeden de atmosfer taşıyan sert geçişli yüzeyler ve
            teknik çerçeveler kullanıldı.
          </p>
        </section>

        <!-- SKYZON DEVELOPMENT: Galeri kartlari -->
        <section class="panel">
          <div class="gallery-grid">
            <figure class="visual-card ember">
              <figcaption>Turuncu sıcaklık ve gölge dengesi</figcaption>
            </figure>
            <figure class="visual-card wave">
              <figcaption>Mavi frekans hissi veren akış</figcaption>
            </figure>
            <figure class="visual-card night">
              <figcaption>Derin siyah yüzey üzerinde şehir ışığı etkisi</figcaption>
            </figure>
            <figure class="visual-card steel">
              <figcaption>Metalik ve soğuk bir ritim</figcaption>
            </figure>
            <figure class="visual-card signal">
              <figcaption>Uyarı paneli gibi güçlü bir kontrast</figcaption>
            </figure>
            <figure class="visual-card haze">
              <figcaption>Karanlık içinde yumuşak aydınlatma</figcaption>
            </figure>
          </div>
        </section>
      </main>

      <!-- SKYZON DEVELOPMENT: Alt bilgi -->
      <footer class="footer">
        <p>© 2026 Template 2 | SKYZON DEVELOPMENT</p>
      </footer>
